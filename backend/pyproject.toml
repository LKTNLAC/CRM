[project]
name = "language-school-crm-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "gunicorn==22.0.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.13.3",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "argon2-cffi==23.1.0",
    "redis==5.0.8",
    "celery==5.4.0",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    "structlog==24.4.0",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "import-linter==2.1",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "aiosqlite==0.20.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "secrets*", "tests*"]

# =========================================================
# Ruff
# =========================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RET", "SIM"]
ignore = ["S101"]

# =========================================================
# Mypy
# =========================================================

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# =========================================================
# Pytest
# =========================================================

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
addopts = "-ra"

# =========================================================
# Import Linter — Dependency Direction Rules
# =========================================================

[tool.importlinter]
root_package = "app"
include_external_packages = true

# Contract 1: Domain purity
# domain/ không được import framework, ORM, integration, api
[[tool.importlinter.contracts]]
name = "Domain purity"
type = "forbidden"
source_modules = [
    "app.modules.leads.domain",
    "app.modules.students.domain",
    "app.modules.guardians.domain",
    "app.modules.courses.domain",
    "app.modules.classes.domain",
    "app.modules.enrollments.domain",
    "app.modules.attendance.domain",
    "app.modules.examinations.domain",
    "app.modules.tasks.domain",
    "app.modules.workflows.domain",
    "app.modules.notifications.domain",
    "app.modules.communications.domain",
    "app.modules.auth.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy"]