name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Typecheck (mypy)
        working-directory: backend
        run: mypy app

      - name: Architecture test (import-linter)
        working-directory: backend
        run: lint-imports

      - name: Unit tests
        working-directory: backend
        run: pytest app/tests/unit -v

      - name: Integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://crm:crm@localhost:5432/crm_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest app/tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}