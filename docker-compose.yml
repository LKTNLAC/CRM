services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose:
      - "8000"
    volumes:
      - ./backend/secrets:/app/secrets:ro

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A app.workers.celery_app worker -l info
    volumes:
      - ./backend/secrets:/app/secrets:ro
  
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat -l info
    env_file: .env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports: ["8081:80"]
    depends_on:
      - backend

volumes:
  pgdata:
